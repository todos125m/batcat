<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body>
<title>کیک خیس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;900&display=swap">
<style>
  /* Layout: header (title + runaway cancel), one scene card with the tired cat at his desk, his chat messages, one big button. */
  :root{
    /* single Gotham-night look on purpose */
    --bg:#0D0F18;
    --surface:#161927;
    --surface-2:#222741;
    --line:#2A2F47;
    --fg:#ECEDF5;
    --muted:#8E93AD;
    --navy:#33448F;
    --gray:#8B90A6;
    --yellow:#F5C518;
    --cake:#F28CB1;
    --font-ui:"Vazirmatn",system-ui,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent}
  #app{
    direction:rtl;position:relative;box-sizing:border-box;min-height:100%;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:16px 24px;max-width:560px;margin-inline:auto;
    display:flex;flex-direction:column;gap:14px;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:clamp(1.15rem,4.6vw,1.5rem);font-weight:900}
  .cancelSlot{position:relative;width:98px;height:40px;flex:none}
  #cancel{
    position:absolute;inset:0;font-family:inherit;font-size:.84rem;font-weight:600;
    background:var(--surface-2);color:var(--fg);border:1px solid var(--line);border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:left .3s cubic-bezier(.2,1.3,.4,1),top .3s cubic-bezier(.2,1.3,.4,1),background .2s;z-index:20;
  }
  #cancel.fly{position:fixed;inset:auto;width:98px;height:40px}
  #cancel.calm{background:#6B2D45;border-color:#6B2D45}
  #cancel:focus-visible,#give:focus-visible,.ov button:focus-visible,.ov select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  #toast{min-height:1.4em;margin:0;color:var(--muted);font-size:.84rem;line-height:1.6}

  .scene{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
  .scene svg{display:block;width:100%;height:auto}
  .steam{animation:steam 2.6s ease-in infinite;transform-box:fill-box}
  .steam.b{animation-delay:1.1s}
  @keyframes steam{0%{opacity:0;transform:translateY(4px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-14px)}}
  .lid{transition:transform .12s;transform-box:fill-box;transform-origin:center top}
  #cat.blink .lid{transform:scaleY(1.9)}
  .glow{animation:glow 3s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.8}50%{opacity:1}}
  .happyOnly{display:none}#cat.happy .happyOnly{display:inline}#cat.happy .tiredOnly{display:none}
  .zz{animation:zz 3.2s ease-in infinite;font-weight:900;fill:var(--muted)}
  @keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:.9}100%{opacity:0;transform:translate(8px,-14px)}}
  #cat.happy .zz{display:none}

  .chat{display:flex;flex-direction:column;gap:8px;min-height:150px}
  .msg{align-self:flex-start;max-width:86%;background:var(--surface-2);border-radius:16px 16px 16px 4px;padding:9px 13px;font-size:.92rem;line-height:1.7;animation:pop .25s ease-out}
  .msg.ask{background:var(--yellow);color:#1E1700;font-weight:600}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .typing{align-self:flex-start;color:var(--muted);font-size:.8rem}

  #give{font-family:inherit;font-size:1.05rem;font-weight:900;background:var(--cake);color:#2B1220;border:0;border-radius:18px;padding:15px 18px;cursor:pointer}
  #give:active{transform:translateY(1px)}
  .heart{position:absolute;color:var(--cake);font-size:22px;pointer-events:none;animation:up 1.3s ease-out forwards;line-height:1}
  @keyframes up{0%{opacity:1;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-80px) scale(1.2)}}
  .fly-cake{animation:drop .9s ease-in forwards}
  @keyframes drop{0%{opacity:0;transform:translateY(-60px)}30%{opacity:1}100%{opacity:1;transform:translateY(0)}}

  .sent{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:.86rem;line-height:1.7}
  .sent[hidden]{display:none}
  .sent textarea{font-family:inherit;font-size:.84rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:none;min-height:3.6em;box-sizing:border-box;width:100%}
  .sent button{align-self:flex-start;font-family:inherit;font-size:.84rem;font-weight:600;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}

  .ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 94%,black);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;direction:rtl;text-align:center;overflow:auto}
  .ov[hidden]{display:none}
  .ovbox{max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;align-items:center}
  .ovbox p{margin:0;font-size:1.02rem;line-height:1.8;font-weight:600}
  .ovbox h2{margin:0;font-size:1.15rem;font-weight:900}
  .ovbox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .ov button{font-family:inherit;font-size:.9rem;font-weight:600;border-radius:12px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
  .ov button.main{background:var(--cake);border-color:var(--cake);color:#2B1220}
  .ov button:disabled{opacity:.4;cursor:not-allowed}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .ov .chip{font-size:.82rem;border-radius:99px;padding:8px 13px}
  .ov .chip.on{background:var(--yellow);border-color:var(--yellow);color:#1E1700}
  .sel{display:grid;grid-template-columns:1fr 1.5fr 1.2fr;gap:8px;width:100%}
  .ov select{font-family:inherit;font-size:.95rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 8px;width:100%;min-width:0;color-scheme:dark}
  #picked{margin:0;min-height:1.6em;font-size:.92rem;color:var(--yellow);font-weight:600}
  @media (prefers-reduced-motion: reduce){
    .steam,.glow,.zz,.msg,.heart,.fly-cake{animation:none}#cancel{transition-duration:.01ms}
  }
</style>

<div id="app">
  <header>
    <h1>بت‌گربه</h1>
    <div class="cancelSlot"><button id="cancel" type="button">✕ لغو</button></div>
  </header>
  <p id="toast">بت‌گربه پشت سیستمه و کم مونده سرش رو بذاره رو کیبورد.</p>

  <div class="scene" id="scene">
    <svg id="cat" viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg" aria-label="بت‌گربه پشت لپ‌تاپ">

      <circle cx="150" cy="92" r="42" fill="#33448F"/>

      <!-- eyes -->

        <ellipse cx="132" cy="90" rx="11" ry="9" fill="#fff"/><ellipse cx="168" cy="90" rx="11" ry="9" fill="#fff"/>
        <circle cx="133" cy="93" r="4.6" fill="#10131F"/><circle cx="169" cy="93" r="4.6" fill="#10131F"/>
        <rect class="lid" x="120" y="79" width="24" height="11" fill="#33448F"/><rect class="lid" x="156" y="79" width="24" height="11" fill="#33448F"/>
        <path d="M122,90 H143 M157,90 H178" stroke="#1E2757" stroke-width="2.4"/>
        <path d="M122,102 Q132,107 142,102 M158,102 Q168,107 178,102" fill="none" stroke="#252E70" stroke-width="3" stroke-linecap="round"/>
        <path d="M140,124 Q150,119 160,124" fill="none" stroke="#10131F" stroke-width="2.4" stroke-linecap="round"/>

        <ellipse cx="116" cy="108" rx="7" ry="4" fill="#F28CB1" opacity=".8"/><ellipse cx="184" cy="108" rx="7" ry="4" fill="#F28CB1" opacity=".8"/>
        <path d="M138,118 Q150,134 162,118 Z" fill="#7A2A3E" stroke="#10131F" stroke-width="2" stroke-linejoin="round"/>
      </g>
      <path d="M145,108 H155 L150,114 Z" fill="#10131F"/>
      <g stroke="#ECEDF5" stroke-width="1.8" stroke-linecap="round" opacity=".6"><path d="M130,112 L106,108 M130,117 L106,121 M170,112 L194,108 M170,117 L194,121"/></g>
      <!-- laptop (back) -->
      <path d="M84,152 L216,152 L226,206 L74,206 Z" fill="#2B2F44"/>
      <path d="M74,206 H226 V214 H74 Z" fill="#1C1F30"/>
      <g class="glow"><ellipse cx="150" cy="178" rx="22" ry="12" fill="#F5C518"/><path d="M150,170 L142,166 L143,174 L137,178 L145,178 L150,186 L155,178 L163,178 L157,174 L158,166 Z" fill="#2B2F44"/></g>
      <!-- paws -->
      <ellipse cx="118" cy="152" rx="13" ry="7" fill="#8B90A6"/><ellipse cx="182" cy="152" rx="13" ry="7" fill="#8B90A6"/>
      <!-- mug -->
      <path d="M230,190 H256 V212 Q256,218 250,218 H236 Q230,218 230,212 Z" fill="#ECEDF5"/><path d="M256,196 Q268,198 266,208 Q264,214 256,212" fill="none" stroke="#ECEDF5" stroke-width="3"/>
      <path class="steam" d="M238,186 Q234,178 240,172" fill="none" stroke="#ECEDF5" stroke-width="2.4" stroke-linecap="round"/>
      <path class="steam b" d="M248,186 Q244,178 250,172" fill="none" stroke="#ECEDF5" stroke-width="2.4" stroke-linecap="round"/>
      <text class="zz" x="196" y="64" font-size="22">z</text>
      <g id="cakeHolder"></g>
    </svg>
  </div>

  <div class="chat" id="chat" aria-live="polite"></div>

  <button id="give" type="button">کیک خیس بده</button>

  <div class="sent" id="sent" hidden>
    <span id="sentMsg"></span>
    <textarea id="sentText" readonly></textarea>
    <button id="copy" type="button">کپی پیام</button>
  </div>

  <div class="ov" id="pick" hidden>
    <div class="ovbox">
      <h2>کیک خیس برای کدوم روز؟</h2>
      <p style="font-size:.88rem;color:var(--muted)">بت‌گربه بدون روز و تاریخ کیک نمی‌گیره.</p>
      <div class="chips" id="chips"></div>
      <div class="sel">
        <select id="sd" aria-label="روز"></select>
        <select id="sm" aria-label="ماه"></select>
        <select id="sy" aria-label="سال"></select>
      </div>
      <p id="picked"></p>
      <div class="row">
        <button class="main" id="ok" type="button" disabled>این روز، کیک بده</button>
        <button id="nope" type="button">بیخیال</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ov" hidden>
    <div class="ovbox">
      <p>لغو می‌کنی؟ بت‌گربه می‌ره پشت کیبورد گریه می‌کنه... کیک خیسش هنوز نرسیده</p>
      <div class="row">
        <button class="main" id="back" type="button">برمی‌گردم</button>
        <button id="go" type="button">برم</button>
      </div>
      <p id="goMsg" style="font-size:.84rem;color:var(--muted)" hidden>اینجا نمی‌شه بستش. تب رو خودت ببند.</p>
    </div>
  </div>
</div>

<script>
(function(){
  var MAX=10;
  /* Where each chosen date goes so the owner sees it. Fill one of these in:
     RELAY_URL = a small server that forwards to the owner (the bot token must never go in this public page).
     OWNER_USERNAME = the owner's Telegram username (no @); Telegram opens a ready message to them. */
  var RELAY_URL='';
  var OWNER_USERNAME='';

  var lines=[
    {t:'سلام...'},
    {t:'سلام ملام علیکم، حال شما؟ حال من که خرابه'},
    {t:'من بتمنم. تمام شب گاتهام رو نجات دادم، جوکر رو سه بار گرفتم، دو بار فرار کرد'},
    {t:'الان هم دارم گزارشی می‌نویسم که هیچکس نمی‌خونه'},
    {t:'یه چیزی یادمه: یه بار یه کیک خیس انداختی تو صورت هولسون. قول دادی دیگه نکنی'},
    {t:'قبول، قول قوله. ولی من گناه دارم، یه کیک خیس بده جبران شه',ask:1},
    {t:'کیک خیس من کو؟ یه کیکم بده، خیلی گناه دارم، آخه آخه؟',ask:1}
  ];
  var again=['کیک خیس من کو؟ آلفرد هم نداره','آخه... آخه؟','من گناه دارم آخه، آخه؟','یه کیک واسه من زیاده مگه؟ برای جوکر زیاد بود؟','آلفرد گفت از تو بخوام. تو هم نداری؟','دارم از گرسنگی ماسکم شل می‌شه','خسته‌م... کیک خیس...'];
  var quips=['نه نه، اول کیک بده!','لغو؟ من لغو نمی‌شم، من بتمنم.','دستت کنده! حتی جوکر هم سریع‌تر می‌گیره.','گاتهام منتظره، تو می‌خوای بری؟','اینجا بمون. من گناه دارم.','تو سایه‌ها گم شدم.','عدالت لغو نمی‌شه.','آلفرد گفت اجازه نده!','فکر کردی؟ شب‌ها شغلم همینه.','آخرین بار بود، قول می‌دم. قول بتمنی.'];
  var glad=['خیسه! بهترین کیک این ماه، بعد از کیک هولسون','به رابین نگو که کیک خوردم','دمت گرم! ماسکم دوباره سفت شد','حتی بتمن هم کیک می‌خواد، حتی خیسش','آلفرد: «آقا کیک؟!» من: «ساکت»'];

  function $(id){return document.getElementById(id)}
  function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  var toast=$('toast'), chat=$('chat'), cat=$('cat');

  /* ---- chat: the cat talks ---- */
  var idx=0, typing=null;
  function addMsg(text,ask){
    var m=document.createElement('div'); m.className='msg'+(ask?' ask':''); m.textContent=text;
    chat.appendChild(m);
    while(chat.children.length>5) chat.removeChild(chat.firstChild);
  }
  function showTyping(on){
    if(on&&!typing){ typing=document.createElement('div'); typing.className='typing'; typing.textContent='بت‌گربه داره می‌نویسه...'; chat.appendChild(typing) }
    if(!on&&typing){ typing.remove(); typing=null }
  }
  var happyNow=false;
  function next(){
    if(happyNow){ setTimeout(next,1500); return }
    showTyping(true);
    setTimeout(function(){
      if(happyNow){ showTyping(false); setTimeout(next,1500); return }
      showTyping(false);
      var l=idx<lines.length?lines[idx++]:{t:pick(again),ask:1};
      addMsg(l.t,l.ask);
      setTimeout(next,idx<lines.length?1700:4200);
    },1100);
  }
  setTimeout(next,600);

  setInterval(function(){ cat.classList.add('blink'); setTimeout(function(){cat.classList.remove('blink')},160) },2600);

  /* ---- Jalali (Shamsi) calendar ---- */
  function div(a,b){return ~~(a/b)}
  function mod(a,b){return a-~~(a/b)*b}
  var BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
  function jalCal(jy){
    var gy=jy+621, leapJ=-14, jp=BR[0], jm, jump=0, leap, leapG, march, n, i;
    for(i=1;i<BR.length;i++){ jm=BR[i]; jump=jm-jp; if(jy<jm) break; leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4); jp=jm }
    n=jy-jp; leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
    if(mod(jump,33)===4 && jump-n===4) leapJ+=1;
    leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150; march=20+leapJ-leapG;
    if(jump-n<6) n=n-jump+div(jump+4,33)*33;
    leap=mod(mod(n+1,33)-1,4); if(leap===-1) leap=4;
    return {leap:leap,gy:gy,march:march};
  }
  function g2d(gy,gm,gd){
    var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
    return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;
  }
  function j2d(jy,jm,jd){ var r=jalCal(jy); return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1 }
  function d2g(jdn){
    var j=4*jdn+139361631; j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
    var i=div(mod(j,1461),4)*5+308, gd=div(mod(i,153),5)+1, gm=mod(div(i,153),12)+1, gy=div(j,1461)-100100+div(8-gm,6);
    return new Date(gy,gm-1,gd,12,0,0);
  }
  function jDate(y,m,d){ return d2g(j2d(y,m,d)) }
  function mlen(y,m){ return m<=6?31:(m<=11?30:(jalCal(y).leap===0?30:29)) }
  function jparts(d){
    try{
      var o={}; new Intl.DateTimeFormat('en-US-u-ca-persian-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}).formatToParts(d).forEach(function(x){o[x.type]=x.value});
      return {y:+o.year,m:+o.month,d:+o.day};
    }catch(e){ return {y:1405,m:1,d:1} }
  }
  var MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  var WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
  function nice(d){ var p=jparts(d); return WD[d.getDay()]+' '+fa(p.d)+' '+MN[p.m-1] }
  function full(d){ var p=jparts(d); return WD[d.getDay()]+' '+fa(p.y)+'/'+fa(p.m)+'/'+fa(p.d) }

  var chosen=null, sd=$('sd'), sm=$('sm'), sy=$('sy');
  function opt(v,t){var o=document.createElement('option');o.value=v;o.textContent=t;return o}
  function fillDays(keep){
    var y=+sy.value, m=+sm.value, n=(y&&m)?mlen(y,m):31;
    sd.innerHTML=''; sd.appendChild(opt('','روز'));
    for(var i=1;i<=n;i++) sd.appendChild(opt(i,fa(i)));
    if(keep&&keep<=n) sd.value=keep;
  }
  function buildSelects(){
    var cy=jparts(new Date()).y;
    sm.innerHTML=''; sm.appendChild(opt('','ماه')); MN.forEach(function(t,i){sm.appendChild(opt(i+1,t))});
    sy.innerHTML=''; sy.appendChild(opt('','سال')); for(var y=cy;y<=cy+3;y++) sy.appendChild(opt(y,fa(y)));
    fillDays(0);
  }
  function setDate(d,chipEl,fromSel){
    chosen=d; $('picked').textContent='روز انتخابی: '+full(d); $('ok').disabled=false;
    if(!fromSel){ var p=jparts(d); sy.value=p.y; sm.value=p.m; fillDays(p.d); sd.value=p.d }
    var cs=document.querySelectorAll('#chips .chip');
    for(var i=0;i<cs.length;i++) cs[i].classList.toggle('on',cs[i]===chipEl);
  }
  function selChange(e){
    if(e&&e.target!==sd) fillDays(+sd.value||0);
    if(sy.value&&sm.value&&sd.value){ setDate(jDate(+sy.value,+sm.value,+sd.value),null,true) }
    else { chosen=null; $('ok').disabled=true; $('picked').textContent='' }
  }
  sd.addEventListener('change',selChange); sm.addEventListener('change',selChange); sy.addEventListener('change',selChange);
  function addChip(text,d){
    var b=document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=text;
    b.addEventListener('click',function(){setDate(d,b)}); $('chips').appendChild(b);
  }
  function buildChips(){
    $('chips').innerHTML='';
    var t=new Date(); t.setHours(12,0,0,0);
    function plus(n){var d=new Date(t);d.setDate(d.getDate()+n);return d}
    addChip('امروز',plus(0)); addChip('فردا',plus(1)); addChip('پس‌فردا',plus(2));
    [6,0,1,2,3,4,5].forEach(function(day){var n=(day-t.getDay()+7)%7; if(n<3) n+=7; addChip(WD[day],plus(n))});
  }

  $('give').addEventListener('click',function(){
    chosen=null; $('picked').textContent=''; $('ok').disabled=true;
    buildSelects(); buildChips(); $('pick').hidden=false;
  });
  $('nope').addEventListener('click',function(){ $('pick').hidden=true; toast.textContent='بدون روز؟ بت‌گربه گناه داره آخه...' });

  /* ---- giving the cake and sending the date ---- */
  function cakeDrop(){
    var h=$('cakeHolder');
    h.innerHTML='<g class="fly-cake"><rect x="128" y="186" width="44" height="18" rx="5" fill="#C98A55"/><path d="M126,186 C126,174 134,171 150,171 C166,171 174,174 174,186 C174,192 171,192 169,189 C167,195 163,195 162,189 C160,194 157,194 155,188 C153,195 148,195 146,188 C144,193 141,193 139,188 C137,194 133,194 131,189 C129,192 126,192 126,186 Z" fill="#fff"/><circle cx="150" cy="169" r="4" fill="#E63D5E"/></g>';
    setTimeout(function(){h.innerHTML=''},2600);
  }
  function hearts(){
    for(var k=0;k<6;k++) (function(k){ setTimeout(function(){
      var h=document.createElement('span'); h.className='heart'; h.textContent='♥';
      h.style.left=(35+Math.random()*30)+'%'; h.style.top='38%';
      var sc=$('scene'); sc.style.position='relative'; sc.appendChild(h); setTimeout(function(){h.remove()},1400);
    },k*150) })(k);
  }

  function ownerText(d,who){
    var s='گزارش فوری گاتهام: بت‌گربه کیک خیس سفارش داد.\nروز: '+full(d)+'\nتاریخ: '+fa(jparts(d).y)+'/'+fa(jparts(d).m)+'/'+fa(jparts(d).d);
    if(who) s+='\nاز طرف: '+who;
    return s;
  }
  function whoAmI(){ try{ var u=Telegram.WebApp.initDataUnsafe.user; return u?(u.first_name||u.username||''):'' }catch(e){ return '' } }

  function showFallback(msg,text){
    $('sentMsg').textContent=msg; $('sentText').value=text; $('sent').hidden=false;
  }
  $('copy').addEventListener('click',function(){
    var t=$('sentText'); t.select();
    try{ navigator.clipboard.writeText(t.value).then(function(){$('copy').textContent='کپی شد'},function(){document.execCommand&&document.execCommand('copy')}) }catch(e){}
  });

  function send(d){
    var who=whoAmI(), text=ownerText(d,who), p=jparts(d);
    if(RELAY_URL){
      fetch(RELAY_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({day:WD[d.getDay()],jalali:p.y+'/'+p.m+'/'+p.d,who:who,text:text})})
        .then(function(r){ if(!r.ok) throw 0; showFallback('تاریخ برای صاحب بات رفت.',text) })
        .catch(function(){ showFallback('نتونستم بفرستم. این پیام رو خودت بفرست:',text) });
      return;
    }
    if(OWNER_USERNAME){
      var url='https://t.me/'+OWNER_USERNAME+'?text='+encodeURIComponent(text);
      try{ if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.openTelegramLink){ Telegram.WebApp.openTelegramLink(url) } else { window.open(url,'_blank') } }catch(e){}
      showFallback('پیام آماده شد؛ تو تلگرام فقط «ارسال» رو بزن. اگه باز نشد، این رو بفرست:',text);
      return;
    }
    showFallback('هنوز مقصدی برای فرستادن تنظیم نشده. این پیام رو خودت بفرست:',text);
  }

  $('ok').addEventListener('click',function(){
    if(!chosen) return;
    var d=chosen; $('pick').hidden=true;
    cakeDrop(); happyNow=true; cat.classList.add('happy'); hearts();
    toast.textContent='کیک خیس برای '+full(d)+' ثبت شد. بت‌گربه قول می‌ده نندازه تو صورت کسی.';
    addMsg(pick(glad),0);
    setTimeout(function(){ happyNow=false; cat.classList.remove('happy'); addMsg('یکی دیگه هم بده... این بار برای هولسون نه',1) },4500);
    send(d);
  });

  /* ---- cancel button runs away 10 times ---- */
  var left=MAX, flying=false, cancel=$('cancel'), give=$('give');
  function hit(a,b,pad){return !(a.right+pad<b.left||a.left-pad>b.right||a.bottom+pad<b.top||a.top-pad>b.bottom)}
  function flee(){
    if(left<=0) return;
    var w=98,h=40,vw=window.innerWidth,vh=window.innerHeight;
    if(!flying){
      var r=cancel.getBoundingClientRect(); cancel.classList.add('fly');
      cancel.style.left=r.left+'px'; cancel.style.top=r.top+'px'; void cancel.offsetWidth; flying=true;
    }
    var cur=cancel.getBoundingClientRect(), gr=give.getBoundingClientRect(), best=null, bd=-1;
    for(var k=0;k<24;k++){
      var x=12+Math.random()*(vw-w-24), y=12+Math.random()*(vh-h-24), box={left:x,top:y,right:x+w,bottom:y+h};
      var dd=Math.hypot(x-cur.left,y-cur.top); if(hit(box,gr,6)) dd*=0.25;
      if(dd>bd){bd=dd;best={x:x,y:y}}
    }
    cancel.style.left=best.x+'px'; cancel.style.top=best.y+'px';
    var n=MAX-left+1; left--;
    toast.textContent='فرار '+fa(n)+' از '+fa(MAX)+': '+quips[n-1];
    if(left===0){ cancel.classList.add('calm'); toast.textContent='باشه، خسته شدم، دیگه فرار نمی‌کنم. می‌خوای واقعاً بت‌گربه رو ول کنی؟' }
  }
  cancel.addEventListener('pointerenter',function(e){ if(e.pointerType==='mouse') flee() });
  cancel.addEventListener('pointerdown',function(e){ if(left>0){ e.preventDefault(); flee() } });
  cancel.addEventListener('click',function(e){ if(left>0){ e.preventDefault(); return } $('ov').hidden=false });
  $('back').addEventListener('click',function(){
    $('ov').hidden=true; $('goMsg').hidden=true; left=MAX;
    cancel.classList.remove('calm','fly'); cancel.style.left=''; cancel.style.top=''; flying=false;
    toast.textContent='بت‌گربه خوشحال شد. این بار هم لغو فرار می‌کنه.';
  });
  $('go').addEventListener('click',function(){
    try{ if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.close){ Telegram.WebApp.close(); return } }catch(e){}
    $('goMsg').hidden=false;
  });
  window.addEventListener('resize',function(){
    if(flying){
      var r=cancel.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight;
      cancel.style.left=Math.max(12,Math.min(vw-110,r.left))+'px'; cancel.style.top=Math.max(12,Math.min(vh-52,r.top))+'px';
    }
  });
})();
</script>
<script>try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}</script></body></html>
