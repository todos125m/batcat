<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="https://telegram.org/js/telegram-web-app.js"></script></head><body>
<title>کیک خیس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;900&display=swap">
<style>
  /* Layout: header row (title + the runaway exit button) over a three-cat stage, then one big feed button and two counters. */
  :root{
    /* single warm-night look on purpose */
    --bg:#1B1226;
    --surface:#261A35;
    --surface-2:#32224A;
    --line:#3F2D59;
    --fg:#F6EDE0;
    --muted:#B2A2C6;
    --cake:#F28CB1;
    --cake-dark:#B5547C;
    --sponge:#C98A55;
    --accent:#FFB84D;
    --tear:#6EC5FF;
    --good:#7FD6A4;
    --font-ui:"Vazirmatn",system-ui,"Segoe UI",sans-serif;
    color-scheme:dark;
  }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);-webkit-tap-highlight-color:transparent}
  #app{
    direction:rtl;position:relative;box-sizing:border-box;min-height:100%;
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:16px 24px;
    max-width:720px;margin-inline:auto;
    display:flex;flex-direction:column;gap:14px;
  }

  header{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{margin:0;font-size:clamp(1.15rem,4.6vw,1.55rem);font-weight:900;text-wrap:balance;min-width:0}
  .exitSlot{position:relative;width:98px;height:40px;flex:none}
  #exit{
    position:absolute;inset:0;
    font-family:inherit;font-size:.84rem;font-weight:600;
    background:var(--surface-2);color:var(--fg);
    border:1px solid var(--line);border-radius:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;
    transition:left .32s cubic-bezier(.2,1.3,.4,1),top .32s cubic-bezier(.2,1.3,.4,1),background .2s;
    z-index:20;
  }
  #exit.fly{position:fixed;inset:auto;width:98px;height:40px}
  #exit.calm{background:var(--cake-dark);border-color:var(--cake-dark)}
  #exit:focus-visible,#feed:focus-visible,.ov button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  #toast{
    min-height:1.4em;margin:0;color:var(--muted);font-size:.84rem;line-height:1.6;
  }

  #stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;margin-top:6px}
  .cat{
    background:var(--surface);border:1px solid var(--line);border-radius:22px;
    padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;
    min-width:0;position:relative;
  }
  .bubble{
    background:var(--fg);color:var(--bg);font-size:.74rem;font-weight:600;line-height:1.5;
    padding:7px 9px;border-radius:12px;text-align:center;min-height:3.1em;width:100%;
    box-sizing:border-box;display:flex;align-items:center;justify-content:center;position:relative;
  }
  .bubble::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--fg)}
  .figure{position:relative;width:100%;max-width:120px}
  .catsvg{display:block;width:100%;height:auto;overflow:visible}
  .tail{transform-origin:88px 112px;animation:wag 3s ease-in-out infinite}
  .cat.happy .tail{animation-duration:.7s}
  @keyframes wag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(12deg)}}
  .happyOnly{display:none}
  .cat.happy .happyOnly{display:inline}
  .cat.happy .sadOnly{display:none}
  .tear{animation:tear 1.8s ease-in infinite;transform-box:fill-box}
  .tear.b{animation-delay:.7s}
  @keyframes tear{0%{opacity:0;transform:translateY(-4px)}20%{opacity:.95}100%{opacity:0;transform:translateY(16px)}}
  .name{font-size:.78rem;color:var(--muted);font-weight:600}
  .cat.happy{border-color:var(--good)}
  .heart{position:absolute;color:var(--cake);font-size:20px;pointer-events:none;animation:up 1.2s ease-out forwards;line-height:1}
  @keyframes up{0%{opacity:1;transform:translate(-50%,0) scale(.6)}100%{opacity:0;transform:translate(-50%,-70px) scale(1.2)}}
  .fly-cake{position:absolute;left:50%;top:6%;width:56px;margin-left:-28px;pointer-events:none;animation:drop .75s ease-in forwards}
  @keyframes drop{0%{opacity:0;transform:translateY(-70px) rotate(-12deg)}35%{opacity:1}80%{opacity:1;transform:translateY(30px) rotate(4deg)}100%{opacity:0;transform:translateY(40px) scale(.9)}}

  #feed{
    font-family:inherit;font-size:1.05rem;font-weight:900;
    background:var(--cake);color:#2B1220;border:0;border-radius:18px;
    padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  }
  #feed:active{transform:translateY(1px)}
  #feed svg{width:34px;height:auto;flex:none}

  .strip{display:flex;gap:10px;flex-wrap:wrap}
  .stat{flex:1 1 140px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;gap:8px;align-items:baseline;min-width:0}
  .stat b{font-size:1.1rem;font-weight:900;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:.78rem}

  .ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,black);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;direction:rtl;text-align:center}
  .ov[hidden]{display:none}
  .ovbox{max-width:360px;display:flex;flex-direction:column;gap:14px;align-items:center}
  .ovbox p{margin:0;font-size:1.05rem;line-height:1.8;font-weight:600}
  .ovbox .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .ov button{font-family:inherit;font-size:.9rem;font-weight:600;border-radius:12px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface-2);color:var(--fg)}
  .ov button.main{background:var(--cake);border-color:var(--cake);color:#2B1220}
  .ovcat{width:120px}

  @media (max-width:420px){ .bubble{font-size:.68rem} }
  @media (prefers-reduced-motion: reduce){
    .tail,.tear{animation:none}
    .heart,.fly-cake{animation-duration:.01ms}
    #exit{transition-duration:.01ms}
  }
</style>

<div id="app">
  <header>
    <h1>گربه‌ها را خوشحال کنید</h1>
    <div class="exitSlot"><button id="exit" type="button">✕ خروج</button></div>
  </header>
  <p id="toast">سه تا گربهٔ گرسنه منتظر کیک خیس‌اند.</p>

  <div id="stage"></div>

  <button id="feed" type="button">
    <svg viewBox="0 0 64 56" aria-hidden="true">
      <rect x="6" y="26" width="52" height="24" rx="6" fill="var(--sponge)"/>
      <rect x="6" y="36" width="52" height="4" fill="#A56C3D" opacity=".55"/>
      <path d="M4,26 C4,14 14,10 32,10 C50,10 60,14 60,26 C60,34 56,34 54,30 C52,38 47,38 46,30 C44,36 40,36 38,29 C36,38 30,38 28,29 C26,36 21,36 19,29 C17,38 12,38 10,30 C8,34 4,34 4,26 Z" fill="var(--cake)"/>
      <circle cx="32" cy="8" r="4.5" fill="#E63D5E"/>
      <path d="M14,54 C12,50 16,50 14,54 Z M32,56 C30,52 34,52 32,56 Z M50,54 C48,50 52,50 50,54 Z" fill="var(--tear)"/>
    </svg>
    <span>کیک خیس بده</span>
  </button>

  <div class="strip">
    <div class="stat"><b id="sCake">۰</b><span>کیک خیس دادی</span></div>
    <div class="stat"><b id="sHappy">۰</b><span>گربهٔ خوشحال الان</span></div>
  </div>

  <div class="ov" id="ov" hidden>
    <div class="ovbox">
      <div class="ovcat" id="ovcat"></div>
      <p>رفتی؟ گربه‌ها هنوز کیکشون خیس نشده...</p>
      <div class="row">
        <button class="main" id="back" type="button">برمی‌گردم</button>
        <button id="go" type="button">برم</button>
      </div>
      <p id="goMsg" style="font-size:.84rem;color:var(--muted)" hidden>اینجا نمی‌شه بستش. تب رو خودت ببند.</p>
    </div>
  </div>
</div>

<script>
(function(){
  var MAX=7;
  var cats=[
    {name:'پشمک',fur:'#E8873C',dark:'#B85F20',belly:'#F7C99A'},
    {name:'نخودی',fur:'#9AA0B4',dark:'#5E6580',belly:'#D8DBE6'},
    {name:'شیرین',fur:'#F1DDBB',dark:'#B99B6A',belly:'#FFF6E6'}
  ];
  var sad=[
    'کیک خیس من کو؟',
    'یه کیکم بده، خیلی گناه دارم',
    'آخه... آخه؟',
    'یه کیک واسه من زیاده مگه؟',
    'من گناه دارم آخه، آخه؟',
    'خیسش کن، خیلی خیس',
    'همه‌ش کیک می‌بینی، به من نمی‌دی'
  ];
  var glad=['خیسه! ممنون!','دمت گرم، خیس‌ترین کیک عمرم','یکی دیگه هم بده','خرخرخر','تو بهترینی'];
  var quips=[
    'نه نه، اول گربه‌ها رو خوشحال کن!',
    'هنوز نه. گربه‌ها دارن نگاه می‌کنن.',
    'یه کیک دیگه بده، بعد.',
    'دستت کنده!',
    'اینجا بمون. گربه‌ها گناه دارن.',
    'تقریباً رسیدی... ولی نه.',
    'آخرین بار بود، قول می‌دم.'
  ];

  function fa(n){return String(n).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d]})}
  function pick(a){return a[Math.floor(Math.random()*a.length)]}
  function $(id){return document.getElementById(id)}

  function catSVG(c){
    return '<svg class="catsvg" viewBox="0 0 120 130" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
      '<path class="tail" d="M88,112 C112,110 118,92 110,78 C106,70 96,72 98,80" fill="none" stroke="'+c.fur+'" stroke-width="10" stroke-linecap="round"/>'+
      '<path d="M24,126 C22,90 36,74 60,74 C84,74 98,90 96,126 Z" fill="'+c.fur+'"/>'+
      '<ellipse cx="60" cy="112" rx="17" ry="14" fill="'+c.belly+'"/>'+
      '<path d="M31,34 L35,6 L56,24 Z" fill="'+c.fur+'"/><path d="M89,34 L85,6 L64,24 Z" fill="'+c.fur+'"/>'+
      '<path d="M37,28 L38,15 L50,25 Z" fill="#F2A7B8"/><path d="M83,28 L82,15 L70,25 Z" fill="#F2A7B8"/>'+
      '<circle cx="60" cy="52" r="33" fill="'+c.fur+'"/>'+
      '<g stroke="'+c.dark+'" stroke-width="3" stroke-linecap="round"><path d="M60,22 L60,30"/><path d="M51,24 L53,31"/><path d="M69,24 L67,31"/></g>'+
      '<ellipse cx="60" cy="66" rx="19" ry="13" fill="'+c.belly+'"/>'+
      /* sad face */
      '<g class="sadOnly">'+
        '<circle cx="47" cy="50" r="8" fill="#fff"/><circle cx="73" cy="50" r="8" fill="#fff"/>'+
        '<circle cx="47.6" cy="51" r="5" fill="#241A30"/><circle cx="73.6" cy="51" r="5" fill="#241A30"/>'+
        '<circle cx="45.4" cy="48.6" r="1.9" fill="#fff"/><circle cx="71.4" cy="48.6" r="1.9" fill="#fff"/>'+
        '<ellipse class="tear" cx="43" cy="62" rx="2.4" ry="3.4" fill="var(--tear)"/>'+
        '<ellipse class="tear b" cx="77" cy="62" rx="2.4" ry="3.4" fill="var(--tear)"/>'+
        '<path d="M38,38 L53,43 M82,38 L67,43" stroke="'+c.dark+'" stroke-width="2.4" stroke-linecap="round"/>'+
        '<path d="M52,74 Q60,67 68,74" fill="none" stroke="#3A2230" stroke-width="2.4" stroke-linecap="round"/>'+
      '</g>'+
      /* happy face */
      '<g class="happyOnly">'+
        '<path d="M39,52 Q47,42 55,52 M65,52 Q73,42 81,52" fill="none" stroke="#241A30" stroke-width="3" stroke-linecap="round"/>'+
        '<ellipse cx="38" cy="64" rx="6" ry="3.6" fill="#F28CB1" opacity=".8"/><ellipse cx="82" cy="64" rx="6" ry="3.6" fill="#F28CB1" opacity=".8"/>'+
        '<path d="M50,68 Q60,80 70,68 Z" fill="#7A2A3E" stroke="#3A2230" stroke-width="2" stroke-linejoin="round"/>'+
      '</g>'+
      '<path d="M56,62 L64,62 L60,67 Z" fill="#D9718A"/>'+
      '<g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".75"><path d="M40,64 L20,60"/><path d="M40,69 L20,73"/><path d="M80,64 L100,60"/><path d="M80,69 L100,73"/></g>'+
    '</svg>';
  }

  var cakeFly='<svg viewBox="0 0 64 56" class="fly-cake" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="26" width="52" height="24" rx="6" fill="var(--sponge)"/><path d="M4,26 C4,14 14,10 32,10 C50,10 60,14 60,26 C60,34 56,34 54,30 C52,38 47,38 46,30 C44,36 40,36 38,29 C36,38 30,38 28,29 C26,36 21,36 19,29 C17,38 12,38 10,30 C8,34 4,34 4,26 Z" fill="var(--cake)"/><circle cx="32" cy="8" r="4.5" fill="#E63D5E"/><path d="M12,54 C9,49 15,49 12,54 Z M32,56 C29,51 35,51 32,56 Z M52,54 C49,49 55,49 52,54 Z" fill="var(--tear)"/></svg>';

  var st={cakes:0,happy:[false,false,false],timers:[null,null,null],left:MAX};
  var stage=$('stage'), nodes=[], bubbles=[];

  cats.forEach(function(c,i){
    var el=document.createElement('div'); el.className='cat';
    el.innerHTML='<div class="bubble">'+pick(sad)+'</div><div class="figure">'+catSVG(c)+'</div><div class="name">'+c.name+'</div>';
    stage.appendChild(el); nodes.push(el); bubbles.push(el.querySelector('.bubble'));
  });

  setInterval(function(){
    var i=Math.floor(Math.random()*3);
    if(!st.happy[i]) bubbles[i].textContent=pick(sad);
  },1700);

  function refresh(){
    var h=st.happy.filter(Boolean).length;
    $('sCake').textContent=fa(st.cakes);
    $('sHappy').textContent=fa(h);
  }

  function heart(i){
    var f=nodes[i].querySelector('.figure'), h=document.createElement('span');
    h.className='heart'; h.textContent='♥';
    h.style.left=(30+Math.random()*40)+'%'; h.style.top='18%';
    f.appendChild(h); setTimeout(function(){h.remove()},1300);
  }

  $('feed').addEventListener('click',function(){
    var hungry=[]; st.happy.forEach(function(h,i){if(!h)hungry.push(i)});
    var i=hungry.length?pick(hungry):Math.floor(Math.random()*3);
    var f=nodes[i].querySelector('.figure');
    f.insertAdjacentHTML('beforeend',cakeFly);
    setTimeout(function(){var k=f.querySelector('.fly-cake');if(k)k.remove()},800);
    st.cakes++;
    clearTimeout(st.timers[i]);
    setTimeout(function(){
      st.happy[i]=true; nodes[i].classList.add('happy');
      bubbles[i].textContent=pick(glad);
      for(var k=0;k<5;k++) setTimeout(function(){heart(i)},k*140);
      refresh();
    },600);
    st.timers[i]=setTimeout(function(){
      st.happy[i]=false; nodes[i].classList.remove('happy');
      bubbles[i].textContent=pick(sad); refresh();
    },4200);
    refresh();
  });

  /* ---- runaway exit button ---- */
  var exit=$('exit'), slot=exit.parentNode, toast=$('toast'), feed=$('feed');
  var flying=false;

  function rects(a,b,pad){return !(a.right+pad<b.left||a.left-pad>b.right||a.bottom+pad<b.top||a.top-pad>b.bottom)}

  function flee(){
    if(st.left<=0) return;
    var w=98,h=40,vw=window.innerWidth,vh=window.innerHeight;
    if(!flying){
      var r=exit.getBoundingClientRect();
      exit.classList.add('fly');
      exit.style.left=r.left+'px'; exit.style.top=r.top+'px';
      void exit.offsetWidth; flying=true;
    }
    var cur=exit.getBoundingClientRect(), fr=feed.getBoundingClientRect(), best=null, bd=-1;
    for(var k=0;k<24;k++){
      var x=12+Math.random()*(vw-w-24), y=12+Math.random()*(vh-h-24);
      var box={left:x,top:y,right:x+w,bottom:y+h};
      var d=Math.hypot(x-cur.left,y-cur.top);
      if(rects(box,fr,6)) d*=0.25;
      if(d>bd){bd=d;best={x:x,y:y}}
    }
    exit.style.left=best.x+'px'; exit.style.top=best.y+'px';
    var n=MAX-st.left+1; st.left--;
    toast.textContent='فرار '+fa(n)+' از '+fa(MAX)+': '+quips[n-1];
    if(st.left===0){
      exit.classList.add('calm');
      toast.textContent='باشه دیگه فرار نمی‌کنم. گربه‌ها رو ول کردی؟';
    }
  }

  exit.addEventListener('pointerenter',function(e){ if(e.pointerType==='mouse') flee() });
  exit.addEventListener('pointerdown',function(e){ if(st.left>0){ e.preventDefault(); flee(); } });
  exit.addEventListener('click',function(e){
    if(st.left>0){ e.preventDefault(); return; }
    $('ovcat').innerHTML=catSVG(cats[0]);
    $('ov').hidden=false;
  });

  $('back').addEventListener('click',function(){
    $('ov').hidden=true; $('goMsg').hidden=true;
    st.left=MAX; exit.classList.remove('calm','fly'); exit.style.left=''; exit.style.top=''; flying=false;
    toast.textContent='گربه‌ها خوشحال شدن. این بار هم خروج فرار می‌کنه.';
  });
  $('go').addEventListener('click',function(){
    try{ if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.close){ Telegram.WebApp.close(); return; } }catch(e){}
    $('goMsg').hidden=false;
  });

  window.addEventListener('resize',function(){
    if(flying){
      var r=exit.getBoundingClientRect(), vw=window.innerWidth, vh=window.innerHeight;
      exit.style.left=Math.max(12,Math.min(vw-110,r.left))+'px';
      exit.style.top=Math.max(12,Math.min(vh-52,r.top))+'px';
    }
  });

  refresh();
})();
</script>
<script>try{Telegram.WebApp.ready();Telegram.WebApp.expand()}catch(e){}</script></body></html>
